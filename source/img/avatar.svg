<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="wingA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="45%" stop-color="#FFA36B"/>
      <stop offset="100%" stop-color="#FF5C8A"/>
    </linearGradient>
    <linearGradient id="wingB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB86B"/>
      <stop offset="100%" stop-color="#FF3D71"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E6"/>
      <stop offset="100%" stop-color="#FFC9A8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FF5C8A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5C8A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="240" height="240" fill="url(#glow)"/>

  <!-- 左上翅 -->
  <path d="M116 118 C 96 62, 44 34, 28 62 C 14 88, 46 118, 92 128 C 102 130, 110 128, 116 118 Z" fill="url(#wingA)"/>
  <!-- 右上翅 -->
  <path d="M124 118 C 144 62, 196 34, 212 62 C 226 88, 194 118, 148 128 C 138 130, 130 128, 124 118 Z" fill="url(#wingA)"/>
  <!-- 左下翅 -->
  <path d="M116 130 C 100 152, 78 190, 96 204 C 112 216, 122 178, 122 146 Z" fill="url(#wingB)" opacity="0.95"/>
  <!-- 右下翅 -->
  <path d="M124 130 C 140 152, 162 190, 144 204 C 128 216, 118 178, 118 146 Z" fill="url(#wingB)" opacity="0.95"/>

  <!-- 翅膀上的浅色纹路 -->
  <path d="M104 112 C 88 86, 62 66, 44 66" stroke="#FFE9D6" stroke-opacity="0.75" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M136 112 C 152 86, 178 66, 196 66" stroke="#FFE9D6" stroke-opacity="0.75" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 身体 -->
  <rect x="115" y="104" width="10" height="80" rx="5" fill="url(#body)"/>
  <circle cx="120" cy="100" r="8" fill="url(#body)"/>

  <!-- 触角 -->
  <path d="M117 94 C 110 76, 100 68, 94 64" stroke="#FFD3A5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M123 94 C 130 76, 140 68, 146 64" stroke="#FFD3A5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="93" cy="63" r="4.5" fill="#FF5C8A"/>
  <circle cx="147" cy="63" r="4.5" fill="#FF5C8A"/>
</svg>
