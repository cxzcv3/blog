<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="up" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE3B8"/>
      <stop offset="45%" stop-color="#FF9E5E"/>
      <stop offset="100%" stop-color="#FF4D7E"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB06A"/>
      <stop offset="100%" stop-color="#E8205E"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8EF"/>
      <stop offset="100%" stop-color="#FFC79B"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C8A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF5C8A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="118" fill="url(#halo)"/>

  <g stroke="#2b1119" stroke-width="2.5" stroke-linejoin="round">
    <!-- 上翅 -->
    <ellipse cx="70" cy="112" rx="46" ry="56" fill="url(#up)" transform="rotate(-34 70 112)"/>
    <ellipse cx="170" cy="112" rx="46" ry="56" fill="url(#up)" transform="rotate(34 170 112)"/>
    <!-- 下翅 -->
    <ellipse cx="86" cy="180" rx="32" ry="36" fill="url(#low)" transform="rotate(26 86 180)"/>
    <ellipse cx="154" cy="180" rx="32" ry="36" fill="url(#low)" transform="rotate(-26 154 180)"/>
  </g>

  <!-- 翅面高光 -->
  <ellipse cx="66" cy="104" rx="19" ry="24" fill="#FFF1DE" opacity="0.30" transform="rotate(-34 66 104)"/>
  <ellipse cx="174" cy="104" rx="19" ry="24" fill="#FFF1DE" opacity="0.30" transform="rotate(34 174 104)"/>

  <!-- 触角 -->
  <g stroke="#2b1119" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M116 86 C 111 68, 106 60, 100 55"/>
    <path d="M124 86 C 129 68, 134 60, 140 55"/>
  </g>
  <circle cx="99" cy="54" r="5.5" fill="#FF4D7E"/>
  <circle cx="141" cy="54" r="5.5" fill="#FF4D7E"/>

  <!-- 身体 -->
  <rect x="113" y="92" width="14" height="96" rx="7" fill="url(#bd)" stroke="#2b1119" stroke-width="2.5"/>
  <circle cx="120" cy="88" r="11" fill="url(#bd)" stroke="#2b1119" stroke-width="2.5"/>
</svg>
