<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="up" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="50%" stop-color="#FF9A6B"/>
      <stop offset="100%" stop-color="#FF4D7E"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB072"/>
      <stop offset="100%" stop-color="#FF2E63"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6EC"/>
      <stop offset="100%" stop-color="#FFC59B"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C8A" stop-opacity="0.40"/>
      <stop offset="75%" stop-color="#FF8A65" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF8A65" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="118" fill="url(#halo)"/>

  <g stroke="#170c11" stroke-width="4" stroke-linejoin="round">
    <!-- 上翅 -->
    <ellipse cx="70" cy="86" rx="48" ry="62" fill="url(#up)" transform="rotate(-38 70 86)"/>
    <ellipse cx="170" cy="86" rx="48" ry="62" fill="url(#up)" transform="rotate(38 170 86)"/>
    <!-- 下翅 -->
    <ellipse cx="80" cy="170" rx="33" ry="42" fill="url(#low)" transform="rotate(28 80 170)"/>
    <ellipse cx="160" cy="170" rx="33" ry="42" fill="url(#low)" transform="rotate(-28 160 170)"/>
  </g>

  <!-- 翅脉高光 -->
  <ellipse cx="66" cy="78" rx="22" ry="30" fill="#FFEBD6" opacity="0.25" transform="rotate(-38 66 78)"/>
  <ellipse cx="174" cy="78" rx="22" ry="30" fill="#FFEBD6" opacity="0.25" transform="rotate(38 174 78)"/>

  <!-- 身体 -->
  <rect x="111" y="96" width="18" height="96" rx="9" fill="url(#bd)" stroke="#170c11" stroke-width="4"/>
  <circle cx="120" cy="92" r="12" fill="url(#bd)" stroke="#170c11" stroke-width="4"/>

  <!-- 触角 -->
  <g stroke="#FFD9A8" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M113 84 C 106 62, 96 52, 88 47"/>
    <path d="M127 84 C 134 62, 144 52, 152 47"/>
  </g>
  <circle cx="87" cy="46" r="6" fill="#FF4D7E"/>
  <circle cx="153" cy="46" r="6" fill="#FF4D7E"/>
</svg>
